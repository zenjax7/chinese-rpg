name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # v3.9.1 world + story data gate (graphs, zones, quests quest/0.2, scenes scene/0.2, public/world freshness).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - run: npm run validate:world
        env:
          CI: 'true'

      # Assets (sprites, backgrounds, audio, assets-manifest.json) are committed under public/.
      # build:ci = `tsc && vite build` without the prebuild sync (the source art/audio folders only exist locally).
      - run: npm run build:ci

      # Headless tests (tests/play.mjs) are not run here: they need a running server on :8795 and a local
      # Chrome at /usr/bin/google-chrome. Run `npm test` locally before pushing.

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
