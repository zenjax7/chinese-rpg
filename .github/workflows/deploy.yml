name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Secret scan of the checked-out tree (the repo is public; architecture.md §14.1).
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact
          rm gitleaks

      - run: npm ci

      # Server ESM guard: Vercel runs each api/** file as Node ESM ("type": "module"), so relative imports in api/, server/ and
      # src/net/ must end in .js. Extensionless ones crash every function with ERR_MODULE_NOT_FOUND. (test:api also runs it,
      # and its tsc -p tsconfig.server.json uses nodenext resolution, which rejects them too.)
      - run: npm run check:esm

      # API tests (server type-check + vitest on in-process PGlite; no database or secrets needed). Runs before the Pages build.
      - run: npm run test:api

      # v3.9.1 world + story data gate (graphs, zones, quests quest/0.2, scenes scene/0.2, public/world freshness).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - run: npm run validate:world
        env:
          CI: 'true'

      # Assets (sprites, backgrounds, audio, assets-manifest.json) are committed under public/.
      # build:ci = `tsc && vite build` without the prebuild sync (the source art/audio folders only exist locally).
      - run: npm run build:ci

      # The static site must never contain server code or server env names (docs/tech/api.md).
      - run: npm run check:dist

      # Jack Oct 12: the built bundle carries no secrets. Scan dist/ for secret-like strings and fail on a hit.
      - name: gitleaks (dist)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir dist --no-banner --redact
          rm gitleaks

      # Headless tests (tests/play.mjs) are not run here: they need a running server on :8795 and a local
      # Chrome at /usr/bin/google-chrome. Run `npm test` locally before pushing.

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
