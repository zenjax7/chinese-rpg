<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="mock.css"><script src="mock.js"></script></head><body>
<div class="sheet"><div class="title">Mockup A: Battle, command state <small>one 1280×720 frame · 3 enemies · command dock inside the scene</small></div>
<div class="row2"><div class="lb"><div class="frame" id="f"><div class="bg" style="background-image:url(file:///workspace/chinese-rpg/prototype/dist/bg/bg_battle_r1_starter_meadow.png)"></div></div></div><div id="n"></div></div></div>
<script>
const f=document.getElementById('f');
sp(f,'hero',290,420,250,0);
foe(f,'rabbit',780,420,200,'角兔',16,16);
foe(f,'mushroom',960,420,200,'蘑菇怪',9,14);
foe(f,'wolf_pup',1140,420,200,'小狼',20,20);
el(f,`<div style="position:absolute;left:766px;top:180px;font-size:30px;color:#ffe27a;text-shadow:0 2px 0 #000">▼</div>`);
party(f);corner(f);
el(f,`<div class="plate" style="left:540px;top:22px;width:200px;height:48px;display:flex;align-items:center;justify-content:center;gap:14px;font:800 19px Nunito">Round 1 <span>🔥 ×2</span></div>`);
// dock
el(f,`<div class="panel" style="left:24px;top:464px;width:1232px;height:236px"></div>`);
el(f,`<div style="position:absolute;left:56px;top:482px;font:700 24px Nunito;color:#fff"><span lang="zh-CN" style="font-size:26px">角兔</span>, <span lang="zh-CN" style="font-size:26px">蘑菇怪</span> and <span lang="zh-CN" style="font-size:26px">小狼</span> appeared! What will you do?</div>`);
const cmds=[['⚔️','攻击','Attack','primary'],['✨','技能','Skills','cream'],['🍯','道具','Items ×1','cream'],['🏃','逃跑','Run','cream']];
cmds.forEach((c,i)=>el(f,`<div class="btn ${c[3]}" style="left:${70+i*290}px;top:538px;width:260px;height:136px"><span class="k">${i+1}</span><div style="font-size:44px;line-height:1">${c[0]}</div><div lang="zh-CN" style="font:700 30px 'Noto Sans CJK SC';margin-top:4px">${c[1]}</div><div style="font:800 19px Nunito;opacity:.8">${c[2]}</div></div>`));
badge(f,1,26,24);badge(f,2,1110,24);badge(f,3,780,160);badge(f,4,200,300);badge(f,5,40,480);badge(f,6,1230,560);badge(f,7,760,46);
dimt(f,'button 260×136 · gap 30px',880,480);dimt(f,'dock 1232×236 · 24px from edges',56,700);
document.getElementById('n').innerHTML=notes([
'<b>Party plate</b> lives in the scene (top-left): portrait, HP, MP and the 小龙 friendship gauge. It replaces the web-style top bar. Numbers 20px, bars 18px tall.',
'<b>System buttons</b> top-right, 64×64: sound and pause. Pause opens settings, word list and the parent area (behind a parent gate). Debug 🐞 only in dev builds.',
'<b>Enemy name + HP in the world</b>, above each enemy: Chinese name 28px with a dark outline, HP bar 130×16. The yellow ▼ marks the current target. No duplicate enemy cards in the panel.',
'<b>Bigger fighters</b>: hero about 230px tall, enemies about 185px (boss 260px) at 1280×720. Today they are about 95px and 80px on screen.',
'<b>Command dock</b>: one fixed box, 1232×236, 16–24px from the frame edge, overlapping the grass. Same size in every battle state, so nothing jumps. One message line on top replaces the scrolling log.',
'<b>4 big commands</b>, 260×136, 30px apart, icon + Chinese word + English. The primary action is gold, the rest cream. Keys 1–4 work on laptops. Items/Skills open a sub-list in the same dock.',
'<b>Only what matters now</b>: round and streak in one small chip. Question count and potion uses move to the Items list and the results screen.'
]);
</script></body></html>
