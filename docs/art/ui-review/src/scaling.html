<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="mock.css"><script src="mock.js"></script>
<style>.dev{position:relative;background:#0b1020;border:6px solid #444;border-radius:14px;overflow:hidden}.dev .fr{position:absolute;background:url(file:///workspace/chinese-rpg/prototype/dist/bg/bg_battle_r1_starter_meadow.png) center/cover}
.dev .safe{position:absolute;border:2px dashed #ffcf4a}.cap{font:700 16px Nunito;color:#333;margin-top:6px;width:100%}.cap b{color:#000}
.grid{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap;width:1780px}</style></head><body>
<div class="sheet"><div class="title">Mockup G: One 16:9 frame, fitted and letterboxed <small>drawn at 30% scale · dark bars fill the rest · gold dashes = 24px UI safe margin inside the frame</small></div>
<div class="grid" id="g"></div>
<div class="notes" style="width:1760px;flex-direction:row;flex-wrap:wrap" id="n"></div></div>
<script>
const D=[['Laptop 1366×768, Chrome','1366×657 viewport',1366,657],['Laptop 1920×1080 at 125% zoom','1536×730 viewport',1536,730],['iPad 10th gen, Safari landscape','≈1180×750 viewport',1180,750],['iPad mini, Safari landscape','≈1133×690 viewport',1133,690],['iPad as home-screen app','1180×820, fullscreen',1180,820],['Tablet held portrait','→ "please turn me sideways" card',820,1180]];
const g=document.getElementById('g');const z=.3;
D.forEach(d=>{const [n,v,w,h]=d;const s=Math.min(w/1280,h/720);const fw=1280*s,fh=720*s;const port=h>w;
 g.insertAdjacentHTML('beforeend',`<div style="width:${w*z+12}px"><div class="dev" style="width:${w*z+12}px;height:${h*z+12}px">
 ${port?`<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:800 18px Nunito;text-align:center">📱↻<br>Turn sideways<br>to play</div>`:`<div class="fr" style="left:${(w-fw)/2*z}px;top:${(h-fh)/2*z}px;width:${fw*z}px;height:${fh*z}px"></div>
 <div class="safe" style="left:${((w-fw)/2+24*s)*z}px;top:${((h-fh)/2+24*s)*z}px;width:${(fw-48*s)*z}px;height:${(fh-48*s)*z}px"></div>`}</div>
 <div class="cap"><b>${n}</b><br>${v}${port?'':`<br>scale <b>${s.toFixed(2)}</b> · bars ${w-fw>1?Math.round((w-fw)/2)+'px left/right':Math.round((h-fh)/2)+'px top/bottom'}`}</div></div>`);});
document.getElementById('n').innerHTML=[
'<b>Design space is 1280×720</b> (logical px). Everything in this review is in those units. The whole frame is scaled by one number: s = min(viewportW/1280, viewportH/720).',
'<b>Smallest real scale is about 0.89</b> (iPad mini in Safari). So a 64px button is ≥56 real px, a 112px answer card is ≥98px, 60px Chinese is ≥53px. Don\'t go below these numbers.',
'<b>Letterbox bars</b>: solid #0b1020 (quick win) or, later, the current background blurred and darkened behind the frame. Never the pink/purple gradient. Bars are not tappable.',
'<b>Crisp on retina</b>: render Phaser at 1920×1080 with camera zoom 1.5 so world coordinates stay 1280×720. The backgrounds are already 1920×1080, so they draw 1:1.',
'<b>Safe areas</b>: keep all UI 24px inside the frame edge, and add env(safe-area-inset-*) padding to the page (iPad home bar). Nothing important in the outer 24px except art.'
].map((t,i)=>`<div class="note" style="width:340px"><div class="b">${i+1}</div><div>${t}</div></div>`).join('');
</script></body></html>
