<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="mock.css"><script src="mock.js"></script>
<style>.sign{position:absolute;transform:translateX(-50%);background:#fff6e0;border:4px solid #7a4a1d;border-radius:16px;padding:6px 16px 8px;text-align:center;box-shadow:0 5px 0 #4a2a0c;color:#1b1b2f;min-width:132px}
.sign .z{font:700 32px 'Noto Sans CJK SC';line-height:1.15;white-space:nowrap}.sign .e{font:800 17px Nunito;opacity:.75}
.sign:after{content:'';position:absolute;left:50%;bottom:-18px;margin-left:-10px;border:10px solid transparent;border-top-color:#7a4a1d}
.glow{position:absolute;border-radius:30px;box-shadow:0 0 0 4px rgba(255,226,122,.9),0 0 30px 8px rgba(255,226,122,.6)}
.small .frame{transform:scale(.5);transform-origin:0 0}.small{width:640px;height:360px;overflow:hidden}
.loc{position:absolute;width:420px;height:300px;border-radius:24px;overflow:hidden;border:4px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.loc .bg{position:absolute;inset:0;background-size:cover}.loc .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(18,30,66,.92);color:#fff;padding:12px 16px}</style></head><body>
<div class="sheet"><div class="title">Mockup F: Village hub (小山村 Little Hill Village) + world map <small>tap the buildings; one "Adventure" exit</small></div>
<div class="row2"><div class="lb"><div class="frame" id="f"><div class="bg" style="background-image:url(file:///workspace/chinese-rpg/prototype/dist/bg/bg_village.png)"></div></div></div><div id="n"></div></div>
<div class="row2"><div class="lb small"><div class="frame" id="g"><div class="bg" style="background-image:url(file:///workspace/chinese-rpg/prototype/dist/bg/bg_map_r1_starter_meadow.png);filter:blur(6px) brightness(.6)"></div></div></div><div id="n2"></div></div></div>
<script>
const f=document.getElementById('f');const k=1280/819;
const S=[['🛏️ 客栈','Inn · rest',137,150],['⚔️ 装备','Gear &amp; skills',305,165],['🧪 商店','Shop',440,170],['📖 学堂','Words &amp; practice',582,140]];
//el(f,`<div class="glow" style="left:${40*k}px;top:${80*k}px;width:${170*k}px;height:${240*k}px;opacity:.55"></div>`);
S.forEach(s=>el(f,`<div class="sign" style="left:${s[2]*k}px;top:${s[3]*k-80}px"><div class="z" lang="zh-CN">${s[0]}</div><div class="e">${s[1]}</div></div>`));
el(f,`<div style="position:absolute;left:${137*k+70}px;top:${150*k-96}px;font-size:40px">❗</div>`);
party(f,{hp:14});corner(f);
el(f,`<div class="plate" style="left:440px;top:16px;width:400px;height:64px;display:flex;align-items:center;justify-content:center;gap:10px;font:800 22px Fredoka;color:#fff">🏘️ <span lang="zh-CN" style="font:700 30px 'Noto Sans CJK SC';color:#ffe27a">小山村</span> Little Hill Village</div>`);
el(f,`<div class="panel" style="left:24px;top:592px;width:1232px;height:112px"></div>`);
el(f,`<div class="btn cream" style="left:48px;top:608px;width:176px;height:80px;flex-direction:row;gap:10px;font:800 22px Nunito"><span style="font-size:32px">🎒</span>Bag</div>`);
el(f,`<div style="position:absolute;left:250px;top:614px;width:640px;color:#fff;font:700 21px Nunito;line-height:1.35">🐲 <span lang="zh-CN" style="font-size:24px">小龙</span>: “The inn is warm! Rest, then let's go to the meadow.”</div>`);
el(f,`<div class="btn primary" style="left:930px;top:602px;width:310px;height:92px;flex-direction:row;gap:12px"><span style="font-size:38px">🗺️</span><div><div lang="zh-CN" style="font:700 30px 'Noto Sans CJK SC';line-height:1.1">出发</div><div style="font:800 17px Nunito">Adventure</div></div></div>`);
el(f,`<div class="sign" style="left:${752*k}px;top:${230*k-70}px;background:#ffcf4a"><div class="z" lang="zh-CN">🗺️ 出发</div><div class="e">Adventure</div></div>`);
badge(f,1,137*k-90,150*k-70);badge(f,2,137*k+130,150*k-80);badge(f,3,582*k+90,140*k-60);badge(f,4,752*k+80,230*k-40);badge(f,5,240,600);badge(f,6,1110,24);
document.getElementById('n').innerHTML=notes([
'<b>The art is the menu.</b> Each building gets a wooden signboard: emoji + Chinese 32px + English 17px, at least 132×72 and tappable, and so is the building under it (glow outline on hover or press). This is the Miitopia and Dragon Quest town idea: places, not buttons.',
'<b>Guidance</b>: a bouncing ❗ marks the one suggested place (for example the inn when HP is under 50%, the shop when there is gold for a potion). The rest stays calm.',
'<b>学堂 Words &amp; practice</b> gets a building: preview, practice and the word list open as full-frame "book" scenes inside the frame, not a scrolling web page.',
'<b>Exit = the gate</b>, and the primary button "出发 Adventure" (310×92, bottom-right) does the same. Both open the world map below.',
'<b>Companion line</b> in the bottom bar gives one friendly hint instead of a wall of buttons.',
'<b>Parent settings</b> move out of the kid\'s hub into ⏸️ → Parents, behind the existing maths gate. The debug button only in dev builds.'
]);
const g=document.getElementById('g');
el(g,`<div class="plate" style="left:440px;top:24px;width:400px;height:64px;display:flex;align-items:center;justify-content:center;font:800 28px Fredoka;color:#ffe27a">🗺️ Where to?</div>`);
el(g,`<div class="loc" style="left:150px;top:130px"><div class="bg" style="background-image:url(file:///workspace/chinese-rpg/prototype/dist/bg/bg_map_r1_starter_meadow.png)"></div><div class="cap"><div style="font:800 26px Fredoka"><span lang="zh-CN" style="font:700 32px 'Noto Sans CJK SC'">🌼 新手草原</span> Starter Meadow</div><div style="font:700 18px Nunito;opacity:.85">Lv 1–3 · fight 2 of 8 · 👑 not beaten</div></div></div>`);
el(g,`<div class="loc" style="left:710px;top:130px;filter:grayscale(.7) brightness(.8)"><div class="bg" style="background-image:url(file:///workspace/chinese-rpg/prototype/dist/bg/bg_map_r2_honeycomb_forest.png)"></div><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:80px">🔒</div><div class="cap"><div style="font:800 26px Fredoka"><span lang="zh-CN" style="font:700 32px 'Noto Sans CJK SC'">🍯 蜂巢森林</span> Honeycomb Forest</div><div style="font:700 18px Nunito">Lv 3–5 · beat 角兔王 to open</div></div></div>`);
el(g,`<div class="btn cream" style="left:48px;top:608px;width:200px;height:80px;flex-direction:row;gap:10px;font:800 22px Nunito">◀ Village</div>`);
document.getElementById('n2').innerHTML=`<div class="notes" style="width:1100px">`+notes([
'<b>World map</b> ("Where to?"): big location cards (420×300) that use each location\'s own map art. Locked cards are greyed with a 🔒 and say in plain words how to open them ("beat 角兔王"). Avoid dark-yellow-on-grey text (today\'s locked card is hard to read).',
'<b>Later, when there are more realms</b>: replace the cards with a painted overworld and the same node style as Mockup E, so the whole game uses one visual language for "places".'
]).replace('<div class="notes">','')+`</div>`;
</script></body></html>
