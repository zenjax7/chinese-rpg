<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="mock.css"><script src="mock.js"></script>
<style>.node{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.n-f{width:64px;height:64px;background:#14224a;border:4px solid #fff;font-size:28px}.n-done{background:#178a47}.n-inn{width:64px;height:64px;background:#fff6e0;border:4px solid #c9b98f;font-size:30px}
.n-next{width:78px;height:78px;background:#ffcf4a;border:5px solid #fff;font-size:34px;box-shadow:0 0 0 10px rgba(255,207,74,.35),0 0 0 20px rgba(255,207,74,.15),0 4px 0 rgba(0,0,0,.4)}
.n-lock{opacity:.8}.n-boss{width:92px;height:92px;background:#7a1f2b;border:5px solid #ffcf4a;font-size:44px}
.tip{position:absolute;background:#fff;color:#1b1b2f;border-radius:12px;padding:6px 12px;font:800 17px Nunito;box-shadow:0 3px 0 #0003;white-space:nowrap}</style></head><body>
<div class="sheet"><div class="title">Mockup E: Location map (新手草原 Starter Meadow) <small>the path nodes sit on the painted path; one big "Go" button</small></div>
<div class="row2"><div class="lb"><div class="frame" id="f"><div class="bg" style="background-image:url(file:///workspace/chinese-rpg/prototype/dist/bg/bg_map_r1_starter_meadow.png)"></div></div></div><div id="n"></div></div></div>
<script>
const f=document.getElementById('f');const k=1280/819;
const P=[['inn',120,345],['f',205,300],['f',262,280],['f',362,285],['f',432,292],['inn',505,263],['f',462,240],['f',405,229],['f',318,208],['f',408,188],['inn',505,192],['gate',545,157],['boss',562,112]];
el(f,`<svg style="position:absolute;inset:0" width="1280" height="720"><polyline points="${P.map(p=>p[1]*k+','+p[2]*k).join(' ')}" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round" opacity=".9"/></svg>`);
let fi=0;P.forEach((p,i)=>{const x=p[1]*k,y=p[2]*k;let c='',t='';
 if(p[0]=='inn'){c='n-inn';t='🛏️';} else if(p[0]=='gate'){c='n-f n-lock';t='🚧';} else if(p[0]=='boss'){c='n-boss';t='👑';} else {fi++; c= fi==1?'n-f n-done':fi==2?'n-next':'n-f'; t= fi==1?'✔':'⚔️';}
 el(f,`<div class="node ${c}" style="left:${x}px;top:${y}px">${t}</div>`);});
// hero token on current node (fight 1 done, standing there)
sp(f,'hero',205*k-6,300*k+4,130,0);
el(f,`<div class="tip" style="left:${262*k-70}px;top:${280*k-88}px">⚔️ Fight 2 of 8</div>`);
el(f,`<div class="tip" style="left:${545*k-470}px;top:${157*k-58}px">🚧 Patrols leave at 21 ready words (you have 6)</div>`);
el(f,`<div class="tip" style="left:${562*k+56}px;top:${112*k-30}px;background:#7a1f2b;color:#fff"><span lang="zh-CN">角兔王</span> · Boss</div>`);
party(f);corner(f);
el(f,`<div class="plate" style="left:440px;top:16px;width:400px;height:64px;display:flex;align-items:center;justify-content:center;gap:10px;font:800 26px Fredoka;color:#ffe27a">🌼 <span lang="zh-CN" style="font:700 30px 'Noto Sans CJK SC'">新手草原</span> <span style="color:#fff;font-size:22px">Starter Meadow</span></div>`);
// bottom action bar
el(f,`<div class="panel" style="left:24px;top:592px;width:1232px;height:112px"></div>`);
[['🏠','Town'],['🎒','Bag'],['📖','Words &amp; practice']].forEach((b,i)=>el(f,`<div class="btn cream" style="left:${48+i*196}px;top:608px;width:${i==2?220:176}px;height:80px;flex-direction:row;gap:10px;font:800 22px Nunito"><span style="font-size:32px">${b[0]}</span>${b[1]}</div>`));
el(f,`<div style="position:absolute;left:700px;top:618px;width:220px;color:#fff;font:700 18px Nunito">📚 Ready words<div class="bar" style="margin-top:6px;height:16px"><i style="width:11%;background:#ffcf4a"></i></div><div style="font-size:16px;opacity:.8;margin-top:2px">6 / 52</div></div>`);
el(f,`<div class="btn primary" style="left:950px;top:602px;width:290px;height:92px;font:800 30px Fredoka;flex-direction:row;gap:12px"><span style="font-size:36px">⚔️</span>Go! Fight 2</div>`);
badge(f,1,440,26);badge(f,2,262*k+46,280*k-30);badge(f,3,195*k,300*k+50);badge(f,4,505*k+44,192*k+30);badge(f,5,545*k+30,157*k+30);badge(f,6,40,600);badge(f,7,1240,600);
document.getElementById('n').innerHTML=notes([
'<b>Location title</b> in Chinese + English, top-centre. Party plate and system buttons stay in exactly the same place as in battle (muscle memory).',
'<b>Nodes on the painted path</b>, not in a separate row of emoji. Next node: 78px gold, pulsing ring, label chip "Fight 2 of 8". Done: green ✔. Ahead: dark navy. All nodes 64px+ and tappable (tap = info chip; only the next node or an inn can be entered).',
'<b>Hero token</b> stands on the current node and walks along the dotted line (400 ms per step) when you press Go. That short walk is the "we are travelling" moment the old screen lacked.',
'<b>Inns are nodes too</b> (entrance, middle, boss approach, as in spec §7.3). Tapping one opens a small "Rest here? 12 🪙" dialog inside the frame.',
'<b>The boss gate explains itself</b> with a sticky chip: "Patrols leave at 21 ready words (you have 6)". The boss crown sits at the big tree.',
'<b>Short bottom bar</b> (1232×112): Town, Bag (items, gear, Return Feather), Words & practice (preview + practice). Secondary cream buttons, 80px tall, 20px apart.',
'<b>One primary action</b>: "Go! Fight 2", 290×92, bottom-right (thumb spot on a tablet). The ready-words meter sits next to it. Everything else is one tap away, not six buttons of equal weight.'
]);
</script></body></html>
