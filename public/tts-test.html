<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTS test v3</title><style>
body{font:17px system-ui;margin:0;padding:8px;background:#111;color:#eee}
.b{display:flex;flex-wrap:wrap;gap:8px}button{font-size:19px;padding:16px 10px;min-width:45%;flex:1;border-radius:12px;border:0;background:#2a6;color:#fff;touch-action:manipulation}
button.o{background:#555}button.k{background:#26a}label{display:block;margin:8px 0;font-size:17px}
#big{font-size:20px;font-weight:bold;padding:10px;border-radius:10px;margin:6px 0;display:none}
#log{width:100%;box-sizing:border-box;height:50vh;background:#000;color:#9f9;font:13px/1.35 monospace;padding:6px;border:2px solid #2a6;-webkit-user-select:text;user-select:text}
#st{font-size:14px;color:#ff0;min-height:1.2em}</style></head><body>
<b>🔊 TTS test v3</b> (b-ver: 2026-10-30c). iPhone: <b>ringer switch ON (not silent)</b>, volume up.
<div id="big"></div>
<div class="b">
<button id="zh">中文: 苹果 (voice)</button><button id="zhn">中文: 你好 (no voice set)</button>
<button id="en">English: apple (voice)</button><button id="enn">English: hello (no voice set)</button>
<button class="o" id="mp3">Play game MP3 clip</button><button class="o" id="voices">List voices</button>
<button class="o" id="cancel">cancel()</button><button class="o" id="sess">audioSession → playback</button>
</div>
<label><input type="checkbox" id="resume"> call resume() before speak</label>
<p><b>Get the log off the phone:</b></p>
<div class="b"><button class="k" id="sel">Select all</button><button class="k" id="copy">Copy log</button>
<button class="k" id="share">Share log…</button><button class="k" id="mail">Email log</button><button class="o" id="clr">Clear log</button></div>
<div id="st"></div>
<textarea id="log" readonly>(JS has not run — if this text stays after tapping, the script is blocked)</textarea>
<p style="font-size:14px">If Copy fails: tap <b>Select all</b>, then long-press inside the green box → Copy. Or use <b>Share log…</b> → Messages/Notes/Mail.</p>
<script src="tts-test.js?v=3"></script></body></html>
